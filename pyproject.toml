[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiopod"
version = "2.10.1"
description = "AudioPod AI audio API for Python: speech-to-text transcription with speaker diarization, stem separation, text-to-speech, voice cloning, music generation, audio-to-MIDI and noise reduction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "AudioPod AI", email = "support@audiopod.ai"}
]
keywords = [
    "audiopod", "audio", "ai", "audio-api", "sdk",
    "speech-to-text", "transcription", "speaker-diarization", "subtitles",
    "text-to-speech", "tts", "voice-cloning",
    "stem-separation", "vocal-remover", "karaoke",
    "music-generation", "audio-to-midi", "noise-reduction", "denoise",
    "mcp", "ai-agents",
    "speech to text", "speaker diarization", "text to speech", "voice cloning",
    "stem separation", "vocal remover", "audio to midi", "music generation",
    "noise reduction", "mcp server",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.32.0",
    "aiohttp>=3.10.11",
]

[project.urls]
Homepage = "https://audiopod.ai"
Documentation = "https://docs.audiopod.ai"
Repository = "https://github.com/AudiopodAI/audiopod-python"
"AI agents" = "https://docs.audiopod.ai/agents"
"MCP server" = "https://docs.audiopod.ai/sdks/mcp"

[project.scripts]
audiopod = "audiopod.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["audiopod*"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true

